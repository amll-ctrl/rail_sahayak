name: Build RailSahayak APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/signup-email-validator
      - feat/train-info-accessible-travel
  pull_request:
    branches:
      - fix/signup-email-validator

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: railsahayak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
